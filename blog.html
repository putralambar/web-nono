permalink: /blog/

{% for post in site.posts %}<article class="pub"><span class="pub-year">{{ post.date | date: '%Y' }}</span><div><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3><p>{{ post.excerpt | strip_html | truncate: 170 }}</p></div></article>{% endfor %}
